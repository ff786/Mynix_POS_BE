spring:
  jackson:
    time-zone: Asia/Colombo
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mynix_pos}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Database-side times (CURRENT_TIMESTAMP defaults) use shop time too.
      connection-init-sql: SET TIME ZONE '${APP_TIMEZONE:Asia/Colombo}'

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false

  flyway:
    enabled: true

  # Product photos (10 MB) and videos (50 MB) from the POS. Nginx in front
  # needs client_max_body_size of at least 55m too.
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 56MB

textlk:
  api-url: ${TEXTLK_API_URL:https://app.text.lk/api/v3/sms/send}
  api-token: ${TEXTLK_API_TOKEN}
  sender-id: ${TEXTLK_SENDER_ID:MYNIX} #Actual API Token related to Sender ID
#sender-id: ${TEXTLK_SENDER_ID:TextLKDemo}  #Temporary Sender ID for testing purposes

mynix:
  public-invoice-base-url: ${MYNIX_PUBLIC_INVOICE_BASE_URL:http://localhost:5173/invoice}
  # Emergency admin reset: set MYNIX_RESET_ADMIN_PASSWORD to a new value (e.g.
  # today's date) and restart; the admin password becomes Admin@123 once and
  # must be changed at sign-in with an SMS code sent to MYNIX_ADMIN_PHONE.
  admin-reset:
    token: ${MYNIX_RESET_ADMIN_PASSWORD:}
    username: ${MYNIX_RESET_ADMIN_USERNAME:admin}
  admin-phone: ${MYNIX_ADMIN_PHONE:0778843815}
  # Extra addresses the POS may be opened from (comma-separated), besides
  # https://mynix-pos-fe.vercel.app and localhost.
  allowed-origins: ${MYNIX_ALLOWED_ORIGINS:}
  # Cloudflare R2 (S3 API) for uploaded product photos and videos. Leave unset
  # to disable uploads; photo links and YouTube links keep working.
  media:
    endpoint: ${MEDIA_STORAGE_ENDPOINT:}
    bucket: ${MEDIA_STORAGE_BUCKET:}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  sms-enabled: ${MYNIX_SMS_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}


